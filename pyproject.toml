[project]
name = "decision-lora"
version = "0.1.0"
description = "多任务决策 LoRA：探针合并、通用语料投影相减、整题路由"
requires-python = ">=3.9"
dependencies = ["numpy>=1.26", "torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
